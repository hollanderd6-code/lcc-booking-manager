<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Logements — Boostinghost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
  <link rel="icon" href="/img/brand/web/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/brand/web/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/img/brand/web/apple-touch-icon.png">
  <link rel="manifest" href="/img/brand/web/manifest.webmanifest">
  <meta name="theme-color" content="#0E3B2E">
  <link rel="stylesheet" href="/css/bh-prop-ios-12.css?v=12c">
  <script>try{if(localStorage.getItem('gx_sidebar_collapsed')==='1')document.documentElement.classList.add('gx-pre-collapsed')}catch(e){}</script>
</head>

<body class="bhp-page" data-page="properties" data-back-href="/manage.html">
  <script src="/js/auth-fetch.js"></script>
  <script src="/js/sub-account-guard.js"></script>
  <script>if(document.documentElement.classList.contains('gx-pre-collapsed'))document.body.classList.add('gx-collapsed');</script>

  <div class="gx-halos" aria-hidden="true"><i class="gx-h1"></i><i class="gx-h2"></i><i class="gx-h3"></i><i class="gx-h4"></i></div>

  <div class="gx-shell">
    <aside class="gx-aside">
      <nav class="gx-nav" aria-label="Navigation principale">
        <a class="gx-logo" href="/app.html"><img class="mono" src="/img/brand/bh-icon-256.png" alt="Boostinghost"><span class="full">Boostinghost</span></a>
        <a class="gx-item" href="/app.html" title="Aujourd'hui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M7 14h10M7 18h6"/></svg><span class="lbl">Aujourd'hui</span></a>
        <a class="gx-item" href="/app.html#calendarSection" title="Calendrier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="lbl">Calendrier</span></a>
        <a class="gx-item" href="/messages.html" title="Messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="lbl">Messages</span><span class="gx-badge" data-gx-unread></span></a>
        <a class="gx-item is-active" href="/manage.html" title="Gestion" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Gestion</span></a>
        <div style="flex:1"></div>
        <button class="gx-item gx-collapse" id="gxCollapse" type="button" title="Réduire le menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg><span class="lbl">Réduire</span></button>
        <div class="gx-sep"></div>
        <button class="gx-account" id="gxAccount" data-account-sheet type="button" title="Mon compte">
          <span class="gx-initials" id="gxInitials">?</span>
          <span class="txt"><span class="t1" id="gxAccountName">Mon compte</span><span class="t2">Changer de compte</span></span>
        </button>
      </nav>
    </aside>

    <main class="gx-main">
      <div id="bhpApp" class="bhp-app"></div>
    </main>
  </div>

  <nav class="gx-tabbar" aria-label="Onglets">
    <a class="gx-tab" href="/app.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M7 14h10M7 18h6"/></svg><span>Aujourd'hui</span></a>
    <a class="gx-tab" href="/app.html#calendarSection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendrier</span></a>
    <a class="gx-tab" href="/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Messages</span><span class="gx-badge" data-gx-unread></span></a>
    <a class="gx-tab is-active" href="/manage.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Gestion</span></a>
  </nav>

  <script>
  (function () {
    var btn = document.getElementById('gxCollapse');
    btn.addEventListener('click', function () {
      var on = document.body.classList.toggle('gx-collapsed');
      try { localStorage.setItem('gx_sidebar_collapsed', on ? '1' : '0'); } catch (e) {}
      btn.title = on ? 'Agrandir le menu' : 'Réduire le menu';
    });
    try {
      var u = JSON.parse(localStorage.getItem('lcc_user') || localStorage.getItem('user') || '{}');
      var name = u.company || u.company_name || [u.firstName || u.first_name, u.lastName || u.last_name].filter(Boolean).join(' ') || u.name || u.email || '';
      if (name) {
        document.getElementById('gxAccountName').textContent = name;
        document.getElementById('gxInitials').textContent = name.trim().charAt(0).toUpperCase();
      }
    } catch (e) {}
  })();
  </script>

  <script src="/js/bh-prop-ios-12.js?v=12c"></script>
  <script>BHP.initList();</script>

  <script src="/js/bh-account-sheet.js" defer></script>
  <script src="/js/messages-badge-desktop-mobile.js"></script>
  <script src="/js/bh-haptics.js"></script>
  <script src="/js/bh-page-transitions.js"></script>
</body>
</html>
