  <!-- Sub-account permission filtering -->
  <script>
  (function() {
    var isSubAccount = localStorage.getItem('lcc_is_sub_account') === 'true'
                    || localStorage.getItem('lcc_account_type') === 'sub';
    if (!isSubAccount) return;

    var permissions = {};
    try {
      var sd = JSON.parse(localStorage.getItem('lcc_sub_account') || '{}');
      if (sd.permissions) permissions = sd.permissions;
    } catch(e) {}
    try {
      var pd = localStorage.getItem('lcc_permissions');
      if (pd) permissions = Object.assign(JSON.parse(pd), permissions);
    } catch(e) {}

    document.querySelectorAll('[data-perm]').forEach(function(el) {
      var perm = el.getAttribute('data-perm');
      if (permissions[perm] !== true) el.style.display = 'none';
    });
  })();
  </script>

  <script src="/js/bh-layout.js?v=fix09"></script>
  <script src="/js/bh-v3-finitions.js"></script>

  <!-- Properties list logic -->
  <script>
  (function() {
    'use strict';

    var allProperties = [];
    var allGroups    = [];
    var diffusionMap = {};
    var activeFilter = null; // null=all, 'ungrouped', or group.id

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function displayName(p) {
      return p.internalName || p.internal_name || p.name || '(sans nom)';
    }

    function isProblem(p) {
      var d = diffusionMap[p.id];
      if (!d) return false;
      return !d.vendable || !d.diffuse;
    }

    function connectionBadge(p) {
      var d = diffusionMap[p.id];
      var hasOTA  = d ? !!d.diffuse : !!(p.channexEnabled && p.channexPropertyId);
      var hasIcal = Array.isArray(p.icalUrls) && p.icalUrls.length > 0;
      if (hasOTA && hasIcal) return { text: 'OTA · iCal', cls: 'prop-badge--ota' };
      if (hasOTA)            return { text: 'OTA',            cls: 'prop-badge--ota' };
      if (hasIcal)           return { text: 'iCal',           cls: 'prop-badge--ical' };
      return                        { text: 'Non relié',      cls: 'prop-badge--none' };
    }

    function subLine(p) {
      var group = allGroups.find(function(g) {
        return Array.isArray(g.propertyIds) && g.propertyIds.indexOf(p.id) !== -1;
      });
      if (group) return group.name;
      if (p.address) return p.address;
      return null;
    }

    function chevronSvg() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
    }

    function houseSvg() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>';
    }

    function renderProblemRow(p) {
      var badge = connectionBadge(p);
      var d = diffusionMap[p.id] || {};
      var reason = (d.a_regler > 0)
        ? d.a_regler + ' point' + (d.a_regler > 1 ? 's' : '') + ' à régler'
        : 'Problème de diffusion';
      return '<div class="prop-problem-card" data-prop-id="' + escHtml(p.id) + '">'
        + '<div class="prop-problem-rail"></div>'
        + '<div class="prop-problem-body">'
        + '<div class="prop-icon" style="background:rgba(201,161,91,0.15);color:#8A5B14;">' + houseSvg() + '</div>'
        + '<div class="prop-text">'
        + '<div class="prop-name">' + escHtml(displayName(p)) + '</div>'
        + '<div class="prop-sub"><span class="prop-badge prop-badge--problem">' + escHtml(reason) + '</span></div>'
        + '</div>'
        + '<span class="prop-badge ' + badge.cls + '">' + escHtml(badge.text) + '</span>'
        + '<div class="prop-chevron">' + chevronSvg() + '</div>'
        + '</div>'
        + '</div>';
    }

    function renderNormalRow(p) {
      var badge = connectionBadge(p);
      var sub   = subLine(p);
      var color = p.color || '#0A2C22';
      return '<div class="prop-row" data-prop-id="' + escHtml(p.id) + '">'
        + '<div class="prop-dot" style="background:' + escHtml(color) + ';"></div>'
        + '<div class="prop-text">'
        + '<div class="prop-name">' + escHtml(displayName(p)) + '</div>'
        + (sub ? '<div class="prop-sub">' + escHtml(sub) + '</div>' : '')
        + '</div>'
        + '<span class="prop-badge ' + badge.cls + '">' + escHtml(badge.text) + '</span>'
        + '<div class="prop-chevron">' + chevronSvg() + '</div>'
        + '</div>';
    }

    function getFilteredProperties() {
      if (!activeFilter) return allProperties;
      if (activeFilter === 'ungrouped') {
        var grouped = new Set(allGroups.reduce(function(acc, g) {
          return acc.concat(g.propertyIds || []);
        }, []));
        return allProperties.filter(function(p) { return !grouped.has(p.id); });
      }
      var group = allGroups.find(function(g) { return g.id === activeFilter; });
      if (!group) return allProperties;
      var ids = new Set(group.propertyIds || []);
      return allProperties.filter(function(p) { return ids.has(p.id); });
    }

    function render() {
      var props    = getFilteredProperties();
      var problems = props.filter(isProblem);
      var normals  = props.filter(function(p) { return !isProblem(p); });

      var html = '';

      if (problems.length > 0) {
        html += '<p class="prop-section-label">À compléter</p>';
        problems.forEach(function(p) { html += renderProblemRow(p); });
      }

      if (normals.length > 0) {
        if (problems.length > 0) {
          html += '<p class="prop-section-label">Logements</p>';
        }
        html += '<div class="prop-list-card">';
        normals.forEach(function(p) { html += renderNormalRow(p); });
        html += '</div>';
      }

      var itemsEl = document.getElementById('propItems');
      var emptyEl = document.getElementById('propEmpty');

      if (props.length === 0) {
        itemsEl.style.display = 'none';
        emptyEl.style.display = '';
        emptyEl.textContent = activeFilter
          ? 'Aucun logement dans ce groupe.'
          : 'Aucun logement pour le moment.';
      } else {
        itemsEl.innerHTML = html;
        itemsEl.style.display = '';
        emptyEl.style.display = 'none';

        itemsEl.querySelectorAll('[data-prop-id]').forEach(function(el) {
          el.addEventListener('click', function() {
            window.location.href = '/property.html?id=' + el.getAttribute('data-prop-id');
          });
        });
      }
    }

    function buildFilterPills(groups) {
      var bar = document.getElementById('propFilterBar');
      if (!bar) return;

      var grouped = new Set(groups.reduce(function(acc, g) {
        return acc.concat(g.propertyIds || []);
      }, []));
      var hasUngrouped = allProperties.some(function(p) { return !grouped.has(p.id); });

      var pills = [{ id: null, label: 'Tous' }];
      groups.forEach(function(g) {
        var cnt = (g.propertyIds || []).filter(function(id) {
          return allProperties.some(function(p) { return p.id === id; });
        }).length;
        pills.push({ id: g.id, label: g.name + ' (' + cnt + ')' });
      });
      if (hasUngrouped) pills.push({ id: 'ungrouped', label: 'Non groupés' });

      bar.innerHTML = pills.map(function(pill) {
        var isActive = (pill.id === activeFilter);
        return '<button class="prop-filter-pill' + (isActive ? ' active' : '') + '"'
          + ' data-pill-id="' + escHtml(pill.id || '') + '">'
          + escHtml(pill.label) + '</button>';
      }).join('');

      bar.querySelectorAll('.prop-filter-pill').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var id = btn.getAttribute('data-pill-id');
          activeFilter = id === '' ? null : id;
          bar.querySelectorAll('.prop-filter-pill').forEach(function(b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          render();
        });
      });
    }

    function updateKicker(count) {
      var text = count === 1 ? '1 logement' : count + ' logements';
      var el = document.getElementById('propKicker');
      if (el) el.textContent = text;
      document.body.setAttribute('data-kicker', text);
      var mobileKicker = document.querySelector('#bhHeader .page-kicker');
      if (mobileKicker) mobileKicker.textContent = text;
    }

    function showError() {
      document.getElementById('propLoading').style.display = 'none';
      var errorEl = document.getElementById('propError');
      errorEl.innerHTML = '<div class="prop-error-msg">Erreur de chargement. Vérifiez votre connexion.</div>'
        + '<button class="prop-retry-btn" onclick="window._propRetry && window._propRetry()">Réessayer</button>';
      errorEl.style.display = '';
    }

    function loadAll() {
      document.getElementById('propLoading').style.display = '';
      document.getElementById('propError').style.display = 'none';
      document.getElementById('propItems').style.display = 'none';
      document.getElementById('propEmpty').style.display = 'none';

      Promise.all([
        fetch('/api/properties').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
        fetch('/api/property-groups').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
        fetch('/api/properties/diffusion').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; })
      ]).then(function(results) {
        var propsData  = results[0];
        var groupsData = results[1];
        var diffData   = results[2];

        allProperties = propsData.properties || [];
        allGroups = (groupsData.groups || []).filter(function(g) {
          return Array.isArray(g.propertyIds) && g.propertyIds.some(function(id) {
            return allProperties.some(function(p) { return p.id === id; });
          });
        });

        diffusionMap = {};
        (diffData.logements || []).forEach(function(l) {
          diffusionMap[l.property_id] = l;
        });

        updateKicker(allProperties.length);
        buildFilterPills(allGroups);

        document.getElementById('propLoading').style.display = 'none';
        render();
      }).catch(function() {
        showError();
      });
    }

    window._propRetry = loadAll;
    loadAll();
  })();
  </script>
