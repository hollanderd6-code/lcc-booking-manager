  <!-- ── Sub-account permission filtering ── -->
  <script>
  (function() {
    var isSubAccount = localStorage.getItem('lcc_is_sub_account') === 'true'
                    || localStorage.getItem('lcc_account_type') === 'sub';
    if (!isSubAccount) return;

    var permissions = {};
    try {
      var sd = JSON.parse(localStorage.getItem('lcc_sub_account') || '{}');
      if (sd.permissions) permissions = sd.permissions;
    } catch(e) {}
    try {
      var pd = localStorage.getItem('lcc_permissions');
      if (pd) permissions = Object.assign(JSON.parse(pd), permissions);
    } catch(e) {}

    var permMap = {
      'can_view_properties':  'can_view_properties',
      'can_view_cleaning':    'can_view_cleaning',
      'can_view_invoices':    'can_view_invoices',
      'can_view_contracts':   'can_view_contracts',
      'can_view_smart_locks': 'can_view_smart_locks',
      'can_view_reporting':   'can_view_reporting',
      'pricing':              'can_view_reservations'
    };

    document.querySelectorAll('.mgios-row[data-perm]').forEach(function(el) {
      var perm = el.getAttribute('data-perm');
      var permKey = permMap[perm] || perm;
      if (permissions[permKey] !== true) el.style.display = 'none';
    });
  })();
  </script>

  <!-- ── Dynamic kicker + counts + diffusion alert ── -->
  <script>
  (function () {
    'use strict';

    function buildKicker(propCount, groupCount) {
      var lg = propCount === 1 ? '1 logement' : propCount + ' logements';
      var gr = groupCount === 1 ? '1 groupe'   : groupCount + ' groupes';
      return lg + ' · ' + gr;
    }

    function applyKicker(text) {
      var desktopSpan = document.getElementById('manageKicker');
      if (desktopSpan) desktopSpan.textContent = text;
      document.body.setAttribute('data-kicker', text);
      var mobileKicker = document.querySelector('#bhHeader .page-kicker');
      if (mobileKicker) mobileKicker.textContent = text;
    }

    function applyPropCount(count) {
      var badge = document.getElementById('managePropCount');
      if (badge) badge.textContent = count > 0 ? count : '';
    }

    function applyDiffusionAlert(logements) {
      if (!logements || !logements.length) return;
      var incomplete = logements.filter(function (l) { return l.a_regler > 0; });
      if (!incomplete.length) return;
      var count = incomplete.length;
      var noun = count === 1 ? 'logement à compléter' : 'logements à compléter';
      var textEl = document.getElementById('manageDiffusionText');
      if (textEl) textEl.textContent = count + ' ' + noun;
      var namesEl = document.getElementById('manageDiffusionNames');
      if (namesEl) namesEl.textContent = incomplete.map(function (l) { return l.nom; }).join(', ');
      var alertEl = document.getElementById('manageDiffusionAlert');
      if (alertEl) alertEl.style.display = 'flex';
    }

    if (typeof authFetch !== 'function') return;

    Promise.all([
      authFetch('/api/properties').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
      authFetch('/api/property-groups').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
      authFetch('/api/properties/diffusion').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
    ]).then(function (results) {
      var propsData  = results[0];
      var groupsData = results[1];
      var diffData   = results[2];

      var propCount  = (propsData.properties  && propsData.properties.length)  || 0;
      var groupCount = (groupsData.groups && groupsData.groups.length) || 0;

      applyKicker(buildKicker(propCount, groupCount));
      applyPropCount(propCount);
      if (diffData.logements) applyDiffusionAlert(diffData.logements);
    });
  })();
  </script>
